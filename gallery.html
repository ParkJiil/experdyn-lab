<style>
:root{--navy:#102b57;--red:#c00000;--green:#67a634;--ink:#17233a;--muted:#6c788a;--line:#e5e9ef;--white:#fff}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink);background:#fff;line-height:1.55}a{color:inherit}.wrap{width:min(1080px,88vw);margin:0 auto}header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}.nav{height:82px;display:flex;align-items:center;justify-content:space-between;gap:30px}.brand{display:flex;align-items:center;gap:10px;text-decoration:none}.brand-label{font-size:20px;font-weight:800;color:var(--navy);white-space:nowrap}.menu{display:flex;align-items:center;gap:30px;font-size:15px;font-weight:650}.menu a{text-decoration:none;color:#222e42}.menu a:hover,.menu a.active{color:var(--green)}.lang-btn{border:1px solid #dce2e8;border-radius:9px;padding:8px 12px;background:#fff;font-weight:800;color:#20314c}.page{padding:72px 0 96px}.page-title{font-size:14px;font-weight:850;letter-spacing:.06em;text-transform:uppercase;color:var(--navy);padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:26px}.section-sub{color:var(--muted);margin:0 0 30px;max-width:760px}.gallery-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.gallery-item{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;text-align:left;cursor:pointer;padding:0;font:inherit;transition:box-shadow .15s,transform .15s}.gallery-item:hover{box-shadow:0 8px 24px #102b571a;transform:translateY(-2px)}.gallery-ph{aspect-ratio:4/3;background:#eef2f6;position:relative;overflow:hidden}.gallery-ph img{width:100%;height:100%;object-fit:cover;display:block}.play-icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#102b57d9;color:white;border-radius:50%;width:56px;height:56px;display:grid;place-items:center;font-size:25px}.video-count{position:absolute;bottom:10px;right:10px;background:#102b57e8;color:white;font-size:12px;border-radius:5px;padding:4px 8px}.gallery-cap{padding:14px 16px}.gallery-cap b{color:var(--navy)}.gallery-cap div{font-size:13px;color:var(--muted);margin-top:3px}.contact-strip{margin-top:54px;padding-top:24px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}footer{background:#0d213f;color:#bbc6d6;padding:34px 0;font-size:13px}.footer-inner{display:flex;justify-content:space-between;gap:30px}.footer-inner strong{color:#fff}
.modal[hidden]{display:none}.modal{position:fixed;inset:0;background:#07152be8;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}.modal-panel{width:min(960px,100%);background:white;border-radius:12px;padding:18px;box-shadow:0 20px 80px #0005}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:12px}.modal-head h2{margin:0;color:var(--navy);font-size:21px}.close{border:0;background:#edf1f6;border-radius:7px;padding:8px 13px;cursor:pointer;font-size:18px}.player{aspect-ratio:16/9;background:#101010}.player iframe{width:100%;height:100%;border:0}.controls{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px}.controls button{border:1px solid #dce2e8;background:white;border-radius:8px;padding:9px 15px;cursor:pointer;color:var(--navy);font-weight:700}.controls button:disabled{opacity:.35;cursor:default}.controls span{font-size:14px;color:var(--muted)}

</style></head><body><header><div class="wrap nav"><a class="brand" href="index.html"><span class="brand-label">XPerDyn Lab.</span></a><nav class="menu"><a href="index.html">Home</a><a href="people.html">People</a><a href="research.html">Research</a><a href="publications.html">Publications</a><a href="news.html">News</a><a class="active" href="gallery.html">Gallery</a><a class="lang-btn" href="#" aria-label="English">EN</a></nav></div></header>
<main class="page"><div class="wrap"><div class="page-title">Gallery</div><p class="section-sub">Field experiments, UAV and LiDAR platforms, simulations, demonstrations, and lab activities.</p>
<div class="gallery-grid" id="galleryGrid"></div>
</div></main><footer><div class="wrap footer-inner"><div><strong>XPerDyn Lab</strong><br>극한환경 국방무인시스템 연구실 · Extreme Perception &amp; Dynamics for Defense</div><div>Ji-il Park · tinz64@kangwon.ac.kr · 033-250-6311</div></div></footer>
<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-panel"><div class="modal-head"><h2 id="modalTitle"></h2><button class="close" id="closeModal" aria-label="Close">✕</button></div><div class="player" id="player"></div><div class="controls"><button id="prev">← Previous</button><span id="counter"></span><button id="next">Next →</button></div></div></div>
<script>
// Add new experiments to this array. Each experiment can contain multiple YouTube video IDs.
const experiments=[
  {title:'UAV Flight Experiment',description:'Drone flight demonstration.',videos:['I84otja-qTE','uoj6PoMBN3I']}
];
const grid=document.getElementById('galleryGrid'),modal=document.getElementById('modal'),player=document.getElementById('player');let currentExperiment=null,currentIndex=0;
experiments.forEach((exp,i)=>{const card=document.createElement('button');card.type='button';card.className='gallery-item';card.innerHTML=`<div class="gallery-ph"><img src="https://i.ytimg.com/vi/${exp.videos[0]}/hqdefault.jpg" alt="${exp.title} video thumbnail" loading="lazy"><span class="play-icon" aria-hidden="true">▶</span><span class="video-count">${exp.videos.length} video${exp.videos.length>1?'s':''}</span></div><div class="gallery-cap"><b>${exp.title}</b><div>${exp.description}</div></div>`;card.addEventListener('click',()=>openExperiment(i));grid.appendChild(card)});
function openExperiment(i){currentExperiment=experiments[i];currentIndex=0;document.getElementById('modalTitle').textContent=currentExperiment.title;modal.hidden=false;document.body.style.overflow='hidden';renderVideo()}
function renderVideo(){const id=currentExperiment.videos[currentIndex];player.innerHTML='';const frame=document.createElement('iframe');frame.src=`https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0`;frame.title=`${currentExperiment.title} video ${currentIndex+1}`;frame.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';frame.allowFullscreen=true;player.appendChild(frame);document.getElementById('counter').textContent=`${currentIndex+1} / ${currentExperiment.videos.length}`;document.getElementById('prev').disabled=currentIndex===0;document.getElementById('next').disabled=currentIndex===currentExperiment.videos.length-1}
function closeModal(){modal.hidden=true;player.innerHTML='';document.body.style.overflow='';currentExperiment=null}
document.getElementById('closeModal').onclick=closeModal;document.getElementById('prev').onclick=()=>{if(currentIndex>0){currentIndex--;renderVideo()}};document.getElementById('next').onclick=()=>{if(currentIndex<currentExperiment.videos.length-1){currentIndex++;renderVideo()}};modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});document.addEventListener('keydown',e=>{if(modal.hidden)return;if(e.key==='Escape')closeModal();if(e.key==='ArrowLeft'&&currentIndex>0){currentIndex--;renderVideo()}if(e.key==='ArrowRight'&&currentIndex<currentExperiment.videos.length-1){currentIndex++;renderVideo()}});
</script></body></html>
